<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Love Story Page</title>

<style>
    .love-photo{
    width:320px;
    border-radius:25px;
    margin-top:30px;
    box-shadow:0 0 40px rgba(255,77,136,0.4);
    transition:0.5s;
}

.love-photo:hover{
    transform:scale(1.05);
}
    <img src="photo.jpg" class="love-photo">


<style>
<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top,#ff4d8860 0%,#000 35%),
    linear-gradient(to bottom,#050505,#000);
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#ff4d8850;
    border-radius:50%;
    filter:blur(140px);
    top:-120px;
    right:-120px;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    width:400px;
    height:400px;
    background:#ff008050;
    border-radius:50%;
    filter:blur(140px);
    bottom:-100px;
    left:-100px;
    z-index:-2;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:85px;
    font-weight:600;
    animation:fadeUp 1.5s ease;
}

.hero h1 span{
    color:#ff4d88;
}

.hero p{
    margin-top:30px;
    max-width:850px;
    color:#ddd;
    line-height:2;
    font-size:24px;
    animation:fadeUp 2s ease;
}

/* SECTION */
.section{
    padding:120px 8%;
}

.title{
    text-align:center;
    font-size:55px;
    margin-bottom:80px;
}

.title span{
    color:#ff4d88;
}

/* MEMORY CARDS */
.memory-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:40px;
}

.memory-card{
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
}

.memory-card h2{
    color:#ff4d88;
    margin-bottom:15px;
}

.memory-card p{
    color:#ddd;
    line-height:1.8;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(50px);}
    to{opacity:1; transform:translateY(0);}
}

@media(max-width:768px){
.hero h1{font-size:50px;}
.hero p{font-size:18px;}
}
</style>

</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>Our <span>Memories</span></h1>
    <p>
        This is a glowing love-themed website. You can add your own memories below.
    </p>
</div>

<!-- MEMORIES -->
<section class="section">
    <div class="title">Memory <span>Cards</span></div>

    <div class="memory-grid">

        <div class="memory-card">
            <h2>First Meet</h2>
            <p>Write your first story here...</p>
        </div>

        <div class="memory-card">
            <h2>Special Day</h2>
            <p>Write your special moment...</p>
        </div>

        <div class="memory-card">
            <h2>Unforgettable Moment</h2>
            <p>Add your emotional memory here...</p>
        </div>

    </div>
</section>

</body>
</html>
